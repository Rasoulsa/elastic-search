name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend quality and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DJANGO_SECRET_KEY: ci-only-ephemeral-secret-key-not-for-production
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      POSTGRES_DB: ci_profiles
      POSTGRES_USER: ci_profiles
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      ELASTICSEARCH_URL: http://127.0.0.1:9200
      ELASTICSEARCH_INDEX: linkedin_profiles_v1
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ci_profiles
          POSTGRES_USER: ci_profiles
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ci_profiles -d ci_profiles"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend requirements
        working-directory: backend
        run: python -m pip install -r requirements.txt

      - name: Run Ruff check
        working-directory: backend
        run: ruff check .

      - name: Check Ruff formatting
        working-directory: backend
        run: ruff format --check .

      - name: Run Django system and migration checks
        working-directory: backend
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run

      - name: Verify PostgreSQL migrations
        working-directory: backend
        run: python manage.py migrate --noinput

      - name: Run backend tests
        working-directory: backend
        run: pytest

  frontend:
    name: Frontend quality and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VITE_API_BASE_URL: http://localhost:8000
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

      - name: Run TypeScript type-check
        working-directory: frontend
        run: npm run typecheck

      - name: Run Vitest suite
        working-directory: frontend
        run: npm test -- --run

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  docker:
    name: Build production containers
    needs:
      - backend
      - frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build backend production image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: profile-search-backend:ci-${{ github.sha }}

      - name: Build frontend production image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: profile-search-frontend:ci-${{ github.sha }}
          build-args: |
            VITE_API_BASE_URL=http://localhost:8000

  compose-smoke:
    name: Compose smoke test
    needs:
      - docker
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      DJANGO_SECRET_KEY: ci-only-compose-secret-key-not-for-production
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      POSTGRES_DB: ci_profiles
      POSTGRES_USER: ci_profiles
      POSTGRES_PASSWORD: ci-only-password
      VITE_API_BASE_URL: http://localhost:8000
      COMPOSE_PROJECT_NAME: profile-search-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build and start services
        run: docker compose up -d --build --wait --wait-timeout 120

      - name: Apply migrations
        run: docker compose run --rm backend python manage.py migrate --noinput

      - name: Verify health endpoints and SPA fallback
        run: |
          set -euo pipefail
          for endpoint in \
            http://localhost:8000/health/live/ \
            http://localhost:8000/health/ready/ \
            http://localhost:5173/ \
            http://localhost:5173/login \
            http://localhost:5173/register \
            http://localhost:5173/search \
            http://localhost:5173/profiles/1; do
            curl --fail --silent --show-error --connect-timeout 5 --max-time 15 "$endpoint" > /dev/null
          done

      - name: Print Compose logs after failure
        if: ${{ failure() }}
        run: docker compose logs --no-color --tail=200 || true

      - name: Stop services and remove temporary volumes
        if: ${{ always() }}
        run: docker compose down --volumes --remove-orphans --timeout 20
